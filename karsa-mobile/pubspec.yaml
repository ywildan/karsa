name: karsa_mobile
description: Aplikasi native SiKarsa untuk mahasiswa dan penanggung jawab mata kuliah.
publish_to: "none"
version: 2.0.0+2

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  app_links: 7.2.1
  crypto: 3.0.6
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.1.0
  http: 1.6.0
  url_launcher: 6.3.2

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: 0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FDFBF7"
  adaptive_icon_foreground: "assets/icon_foreground.png"

flutter:
  uses-material-design: true
