name: Build Karsa Compose APK

on:
  push:
    branches: [main, "feat/**", "fix/**", "rebuild/**"]
    paths:
      - "karsa-mobile-compose/**"
      - ".github/workflows/karsa-compose-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "karsa-mobile-compose/**"
      - ".github/workflows/karsa-compose-build.yml"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versi rilis (kosong = naik otomatis dari tag karsa-v*)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Jangan batalkan build di tengah jalan: rilis yang sedang dibuat harus selesai.
  group: karsa-compose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve build version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v6

      - name: Read release tags
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tags?per_page=100" --paginate --jq '.[].name' > "$RUNNER_TEMP/karsa-tags.txt"

      - name: Resolve version
        id: version
        env:
          PUBLISH: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
          VERSION_OVERRIDE: ${{ inputs.version_name }}
          TAGS_FILE: ${{ runner.temp }}/karsa-tags.txt
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PUBLISH" "$VERSION_OVERRIDE" "$TAGS_FILE" <<'PY'
          import os
          import re
          import sys

          publish = sys.argv[1] == "true"
          override = (sys.argv[2] or "").strip()
          tags_path = sys.argv[3]

          base = override or "3.0.0"
          if not re.fullmatch(r"\d+\.\d+\.\d+", base):
              sys.exit(f"Format versi tidak valid: {base}")
          requested = tuple(int(part) for part in base.split("."))

          try:
              with open(tags_path, encoding="utf-8") as handle:
                  tags = [line.strip() for line in handle if line.strip()]
          except FileNotFoundError:
              tags = []

          released = []
          for tag in tags:
              match = re.fullmatch(r"karsa-v(\d+)\.(\d+)\.(\d+)", tag)
              if match:
                  released.append(tuple(int(part) for part in match.groups()))

          if publish:
              if released and requested <= max(released):
                  if override:
                      sys.exit(f"Versi {base} harus lebih tinggi dari rilis terbaru.")
                  latest = max(released)
                  requested = max(requested, (latest[0], latest[1], latest[2] + 1))
          version = ".".join(str(part) for part in requested)
          tag = f"karsa-v{version}"

          if publish and tag in tags:
              sys.exit(f"Tag {tag} sudah ada; pakai versi lain.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"tag={tag}\n")
              output.write(f"publish={'true' if publish else 'false'}\n")
          print(f"version={version}; tag={tag}; publish={publish}")
          PY

  build:
    name: Build release APK
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.keystore.outputs.configured }}
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Configure release keystore
        id: keystore
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Android keystore secret available; this APK will be debug-signed."
            exit 0
          fi
          key_file="$RUNNER_TEMP/karsa-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          echo "KARSA_KEYSTORE_FILE=$key_file" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Require signing for public release
        if: needs.prepare.outputs.publish == 'true' && steps.keystore.outputs.configured != 'true'
        shell: bash
        run: |
          echo "::error::Rilis publik memerlukan secrets keystore release."
          exit 1

      - name: Build release APK
        working-directory: karsa-mobile-compose
        env:
          VERSION_NAME: ${{ needs.prepare.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          version_code=$((30000 + RUN_NUMBER))
          echo "Building versionName=$VERSION_NAME versionCode=$version_code"
          gradle :app:assembleRelease --no-daemon --stacktrace \
            "-PkarsaVersionName=$VERSION_NAME" \
            "-PkarsaVersionCode=$version_code"

      - name: Verify APK identity
        env:
          SIGNING_CONFIGURED: ${{ steps.keystore.outputs.configured }}
        shell: bash
        run: |
          set -euo pipefail
          apk="karsa-mobile-compose/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$apk" ]]; then
            echo "::error::Release APK was not produced."
            exit 1
          fi
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "--- badging ---"
          "$build_tools/aapt2" dump badging "$apk" | head -1
          echo "--- signature ---"
          "$build_tools/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/apk-signature.txt"
          if [[ "$SIGNING_CONFIGURED" == "true" ]]; then
            actual="$(grep -o '[a-fA-F0-9]\{64\}' "$RUNNER_TEMP/apk-signature.txt" | head -1 | tr 'A-F' 'a-f')"
            expected="$(tr -d '[:space:]' < karsa-mobile/android/release-cert.sha256)"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::APK certificate $actual does not match pinned release certificate $expected."
              exit 1
            fi
            echo "Certificate matches the existing SiKarsa release."
          fi

      - name: Rename APK
        shell: bash
        env:
          VERSION_NAME: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          source_apk="karsa-mobile-compose/app/build/outputs/apk/release/app-release.apk"
          mkdir -p dist
          cp "$source_apk" "dist/Karsa-Mobile-${VERSION_NAME}.apk"
          ( cd dist && sha256sum ./*.apk > SHA256SUMS.txt )

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: karsa-compose-apk-${{ github.sha }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Remove runner keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/karsa-release.jks"

  release:
    name: Publish GitHub release
    needs: [prepare, build]
    if: >-
      needs.prepare.outputs.publish == 'true' &&
      needs.build.outputs.signed == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: karsa-compose-apk-${{ github.sha }}
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          apk="release-assets/Karsa-Mobile-${VERSION}.apk"
          if [[ ! -f "$apk" ]]; then
            echo "::error::APK $apk tidak ditemukan di artifact."
            ls -la release-assets >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Rilis $TAG sudah ada. Naikkan versi."
            exit 1
          fi
          gh release create "$TAG" "$apk" release-assets/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Karsa Mobile $VERSION" \
            --notes "Memerlukan Android 8 atau lebih baru. APK universal untuk ARM dan x86; pasang sebagai pembaruan aplikasi yang sudah ada." \
            --generate-notes
