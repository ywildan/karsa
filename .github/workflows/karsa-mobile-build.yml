name: Validate and Build Karsa Mobile

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "karsa-mobile/**"
      - "app/api/mobile/**"
      - "app/mobile-auth/**"
      - "actions/mobile-auth.ts"
      - "lib/mobile/**"
      - "lib/services/**"
      - "prisma/**"
      - ".github/workflows/karsa-mobile-build.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: URL deployment backend SiKarsa
        required: true
        default: https://www.sikarsa.id

permissions:
  contents: read

env:
  API_BASE_URL: ${{ inputs.api_base_url || 'https://www.sikarsa.id' }}

jobs:
  validate-backend:
    name: Validate mobile API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: karsa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d karsa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/karsa
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/karsa
      AUTH_SECRET: ci-mobile-group-smoke-secret
      AUTH_GOOGLE_ID: ci-placeholder
      AUTH_GOOGLE_SECRET: ci-placeholder
      AUTH_URL: http://127.0.0.1:3100
      SEED_TEST_DATA: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run test:groups
      - name: Prepare isolated smoke database
        run: |
          npx prisma db push --skip-generate
          npm run db:seed
      - name: Run mobile group API smoke tests
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --hostname 127.0.0.1 --port 3100 > "$RUNNER_TEMP/karsa-next.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in {1..60}; do
            if [ "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3100/api/mobile/v1/groups)" = "401" ]; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            tail -n 200 "$RUNNER_TEMP/karsa-next.log"
            exit 1
          fi

          npm run test:groups:integration

  build-apk:
    name: Test and build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Generate isolated Flutter project
        run: flutter create --org ac.id.untidar --project-name karsa_mobile karsa-mobile-build

      - name: Overlay native application
        run: |
          cp karsa-mobile/pubspec.yaml karsa-mobile-build/pubspec.yaml
          rm karsa-mobile-build/test/widget_test.dart
          cp -R karsa-mobile/lib/. karsa-mobile-build/lib/
          cp -R karsa-mobile/test/. karsa-mobile-build/test/
          mkdir -p karsa-mobile-build/assets
          cp karsa-mobile/assets/*.png karsa-mobile-build/assets/
          cp karsa-mobile/android/AndroidManifest.xml karsa-mobile-build/android/app/src/main/AndroidManifest.xml

      - name: Set Android minimum SDK
        run: |
          if [ -f karsa-mobile-build/android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' karsa-mobile-build/android/app/build.gradle.kts
          else
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' karsa-mobile-build/android/app/build.gradle
          fi

      - name: Resolve dependencies in CI
        working-directory: karsa-mobile-build
        run: flutter pub get

      - name: Format generated source
        working-directory: karsa-mobile-build
        run: dart format lib test

      - name: Analyze source
        working-directory: karsa-mobile-build
        shell: bash
        run: |
          set +e
          dart analyze --format=machine . 2>&1 | tee flutter-analyze.log
          analyze_status=${PIPESTATUS[0]}
          set -e

          while IFS='|' read -r severity _type code file line column _length message; do
            case "$severity" in
              ERROR)
                echo "::error file=$file,line=$line,col=$column::$code: $message"
                ;;
              WARNING)
                echo "::warning file=$file,line=$line,col=$column::$code: $message"
                ;;
              INFO)
                echo "::notice file=$file,line=$line,col=$column::$code: $message"
                ;;
            esac
          done < flutter-analyze.log

          exit "$analyze_status"

      - name: Run tests
        working-directory: karsa-mobile-build
        run: flutter test

      - name: Generate launcher icons
        working-directory: karsa-mobile-build
        run: dart run flutter_launcher_icons

      - name: Build release APK
        working-directory: karsa-mobile-build
        run: flutter build apk --release --dart-define=KARSA_API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: karsa-mobile-apk-${{ github.sha }}
          path: karsa-mobile-build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
