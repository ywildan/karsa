name: Validate and Build Karsa Mobile

on:
  push:
    branches: [main, "feat/**", "fix/**", "codex/**"]
    paths:
      - "karsa-mobile/**"
      - "app/api/mobile/**"
      - "app/mobile-auth/**"
      - "actions/mobile-auth.ts"
      - "lib/**"
      - "auth.ts"
      - "middleware.ts"
      - "package*.json"
      - "tsconfig*.json"
      - "next.config.*"
      - "scripts/**"
      - "tests/**"
      - "prisma/**"
      - ".github/workflows/karsa-mobile-build.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: URL deployment backend SiKarsa
        required: true
        default: https://www.sikarsa.id
      publish_release:
        description: Publish the next production APK version automatically (main only)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: karsa-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate build and release inputs
    runs-on: ubuntu-latest
    outputs:
      api_base_url: ${{ steps.config.outputs.api_base_url }}
      version: ${{ steps.config.outputs.version }}
      tag: ${{ steps.config.outputs.tag }}
      pubspec_build: ${{ steps.config.outputs.pubspec_build }}
      build_number: ${{ steps.config.outputs.build_number }}
      publish: ${{ steps.config.outputs.publish }}
      sign_release: ${{ steps.config.outputs.sign_release }}
    steps:
      - uses: actions/checkout@v6
      - name: Test release guards
        run: python3 -m unittest discover -s tests -p 'test_mobile_release*.py'
      - name: Read existing mobile release tags
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/tags?per_page=100" --paginate --jq '.[].name' > "$RUNNER_TEMP/karsa-mobile-tags.txt"
      - name: Validate configuration
        id: config
        env:
          API_BASE_URL_INPUT: ${{ inputs.api_base_url || 'https://www.sikarsa.id' }}
          PUBLISH_RELEASE: ${{ inputs.publish_release && 'true' || 'false' }}
          RELEASE_TAGS_FILE: ${{ runner.temp }}/karsa-mobile-tags.txt
        run: python3 scripts/mobile_release.py
      - name: Require a new release version
        if: steps.config.outputs.publish == 'true'
        env:
          TAG: ${{ steps.config.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fqx "$TAG" "$RUNNER_TEMP/karsa-mobile-tags.txt"; then
            echo "::error::Tag $TAG already exists; automatic version selection failed."
            exit 1
          fi

  validate-backend:
    needs: prepare
    name: Validate mobile API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: karsa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d karsa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/karsa
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/karsa
      AUTH_SECRET: ci-mobile-group-smoke-secret
      AUTH_GOOGLE_ID: ci-placeholder
      AUTH_GOOGLE_SECRET: ci-placeholder
      AUTH_URL: http://127.0.0.1:3100
      SEED_TEST_DATA: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run test:groups
      - run: npm run test:lib-ai
      - name: Prepare isolated smoke database
        run: |
          npx prisma db push --skip-generate
          npm run db:seed
      - name: Test AI cache, quotas, isolation and retries
        env:
          AI_TEST_DB: "true"
        run: npm run test:lib-ai:integration
      - name: Run mobile group API smoke tests
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --hostname 127.0.0.1 --port 3100 > "$RUNNER_TEMP/karsa-next.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in {1..60}; do
            if [ "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3100/api/mobile/v1/groups)" = "401" ]; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            tail -n 200 "$RUNNER_TEMP/karsa-next.log"
            exit 1
          fi

          npm run test:groups:integration

  build-apk:
    needs: prepare
    name: Test and build APK
    runs-on: ubuntu-latest
    outputs:
      apk_ready: ${{ steps.release-signing.outputs.configured }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Generate isolated Flutter project
        run: flutter create --org ac.id.untidar --project-name karsa_mobile karsa-mobile-build

      - name: Overlay native application
        run: |
          cp karsa-mobile/pubspec.yaml karsa-mobile-build/pubspec.yaml
          cp karsa-mobile/pubspec.lock karsa-mobile-build/pubspec.lock
          rm karsa-mobile-build/test/widget_test.dart
          cp -R karsa-mobile/lib/. karsa-mobile-build/lib/
          cp -R karsa-mobile/test/. karsa-mobile-build/test/
          mkdir -p karsa-mobile-build/assets
          cp karsa-mobile/assets/*.png karsa-mobile-build/assets/
          cp karsa-mobile/android/AndroidManifest.xml karsa-mobile-build/android/app/src/main/AndroidManifest.xml
          cp -R karsa-mobile/android/res/. karsa-mobile-build/android/app/src/main/res/

      - name: Apply automatic release version
        if: needs.prepare.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PUBSPEC_BUILD: ${{ needs.prepare.outputs.pubspec_build }}
        run: python3 scripts/mobile_release.py --write-pubspec karsa-mobile-build/pubspec.yaml --version "$VERSION" --pubspec-build "$PUBSPEC_BUILD"

      - name: Set Android minimum SDK
        run: |
          if [ -f karsa-mobile-build/android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' karsa-mobile-build/android/app/build.gradle.kts
          else
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' karsa-mobile-build/android/app/build.gradle
          fi

      - name: Resolve dependencies in CI
        working-directory: karsa-mobile-build
        run: flutter pub get --enforce-lockfile

      - name: Format generated source
        working-directory: karsa-mobile-build
        run: dart format lib test

      - name: Analyze source
        working-directory: karsa-mobile-build
        shell: bash
        run: |
          set +e
          dart analyze --format=machine . 2>&1 | tee flutter-analyze.log
          analyze_status=${PIPESTATUS[0]}
          set -e

          while IFS='|' read -r severity _type code file line column _length message; do
            case "$severity" in
              ERROR)
                echo "::error file=$file,line=$line,col=$column::$code: $message"
                ;;
              WARNING)
                echo "::warning file=$file,line=$line,col=$column::$code: $message"
                ;;
              INFO)
                echo "::notice file=$file,line=$line,col=$column::$code: $message"
                ;;
            esac
          done < flutter-analyze.log

          exit "$analyze_status"

      - name: Run tests
        working-directory: karsa-mobile-build
        run: flutter test

      - name: Generate launcher icons
        working-directory: karsa-mobile-build
        run: dart run flutter_launcher_icons

      - name: Configure permanent Android release signing
        id: release-signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGN_RELEASE: ${{ needs.prepare.outputs.sign_release }}
        run: |
          set -euo pipefail
          if [[ "$SIGN_RELEASE" != "true" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Production signing is restricted to main with the production API."
            exit 0
          fi
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || \
                -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::Configure all four Android signing repository secrets to build a production APK."
            exit 1
          fi

          key_file="$RUNNER_TEMP/karsa-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          echo "KARSA_KEYSTORE_FILE=$key_file" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path("karsa-mobile-build/android/app")
          candidates = [app / "build.gradle.kts", app / "build.gradle"]
          gradle_file = next((path for path in candidates if path.is_file()), None)
          if gradle_file is None:
              raise SystemExit("Generated Android app Gradle file was not found")

          source = gradle_file.read_text()
          signing_block = '''    signingConfigs {
              create("release") {
                  storeFile = file(System.getenv("KARSA_KEYSTORE_FILE"))
                  storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
              }
          }
          '''
          if gradle_file.suffix == ".kts":
              if 'signingConfig = signingConfigs.getByName("debug")' not in source:
                  raise SystemExit("Unexpected Kotlin Gradle release signing template")
              source = re.sub(r"(?m)^android \{", "android {\n" + signing_block, source, count=1)
              source = source.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")',
                  1,
              )
          else:
              groovy_block = '''    signingConfigs {
                  release {
                      storeFile file(System.getenv('KARSA_KEYSTORE_FILE'))
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
              '''
              pattern = r"(?m)^android \{"
              if not re.search(pattern, source):
                  raise SystemExit("Unexpected Groovy Gradle Android block")
              source = re.sub(pattern, "android {\n" + groovy_block, source, count=1)
              debug_signing = re.compile(
                  r"(?m)^([ \t]*)signingConfig(?:\s*=)?\s*(?:signingConfigs\.debug|signingConfigs\.getByName\(['\"]debug['\"]\))\s*$"
              )
              source, replacements = debug_signing.subn(r"\1signingConfig signingConfigs.release", source, count=1)
              if replacements != 1:
                  raise SystemExit("Unexpected Groovy Gradle debug signing configuration")

          gradle_file.write_text(source)
          print(f"Configured stable release signing in {gradle_file}")
          PY

      - name: Build release APK
        working-directory: karsa-mobile-build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ needs.prepare.outputs.api_base_url }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        # --split-per-abi memisahkan mesin render per arsitektur (arm64-v8a,
        # armeabi-v7a, x86_64). Tanpa flag ini Flutter memaketkan ketiganya
        # dalam satu APK, padahal satu perangkat hanya memakai satu.
        run: >-
          flutter build apk --release
          --split-per-abi
          "--dart-define=KARSA_API_BASE_URL=$API_BASE_URL"
          "--build-number=$BUILD_NUMBER"

      - name: Verify APK signatures, manifest, and install metadata
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          SIGNING_CONFIGURED: ${{ steps.release-signing.outputs.configured }}
        shell: bash
        run: |
          set -euo pipefail
          options=()
          if [[ "$SIGNING_CONFIGURED" != "true" ]]; then options+=(--validation-build); fi
          python3 scripts/verify_mobile_apk.py \
            --apk-dir karsa-mobile-build/build/app/outputs/flutter-apk \
            --sdk "$ANDROID_HOME" \
            --version "$VERSION" --build-number "$BUILD_NUMBER" "${options[@]}"

      - name: Upload APK artifact
        if: steps.release-signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: karsa-mobile-apk-${{ github.sha }}
          path: |
            karsa-mobile-build/build/app/outputs/flutter-apk/app-*-release.apk
            karsa-mobile-build/build/app/outputs/flutter-apk/release-metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove runner keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/karsa-release.jks"

  release:
    name: Create GitHub release
    needs: [prepare, validate-backend, build-apk]
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.prepare.outputs.publish == 'true' &&
      needs.validate-backend.result == 'success' &&
      needs.build-apk.result == 'success' &&
      needs.build-apk.outputs.apk_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download signed APKs
        uses: actions/download-artifact@v4
        with:
          name: karsa-mobile-apk-${{ github.sha }}
          path: release-assets

      - name: Name the per-architecture APKs
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(release-assets/*.apk)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "No APK was found in the downloaded artifact." >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            # app-arm64-v8a-release.apk -> Karsa-Mobile-<version>-arm64-v8a.apk
            abi="$(basename "$apk" .apk)"
            abi="${abi#app-}"
            abi="${abi%-release}"
            mv "$apk" "release-assets/Karsa-Mobile-${VERSION}-${abi}.apk"
          done
          printf 'Built %d APK(s):\n' "${#apks[@]}"
          du -h release-assets/*.apk
          printf '\nOnly arm64-v8a is published to the release; the other two stay in this artifact.\n'

      - name: Save release version to main
        id: version-commit
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PUBSPEC_BUILD: ${{ needs.prepare.outputs.pubspec_build }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG was created during this build. Run the workflow again."
            exit 1
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then exit "$status"; fi
          fi
          remote_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::main changed during the release build. Run the workflow again from the latest main."
            exit 1
          fi
          python3 scripts/mobile_release.py --write-pubspec karsa-mobile/pubspec.yaml --version "$VERSION" --pubspec-build "$PUBSPEC_BUILD"
          git add karsa-mobile/pubspec.yaml
          if git diff --cached --quiet; then
            target_sha="$GITHUB_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "chore(mobile): release $VERSION"
            git push origin HEAD:refs/heads/main
            target_sha="$(git rev-parse HEAD)"
          fi
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET_SHA: ${{ steps.version-commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Public release requires Android 7+ with ARM64; other ABIs remain
          # in the build artifact. Keep published versions immutable.
          apk="release-assets/Karsa-Mobile-${VERSION}-arm64-v8a.apk"
          if [[ ! -f "$apk" ]]; then
            echo "Expected arm64-v8a APK was not found in the downloaded artifact." >&2
            ls -la release-assets >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump the app version."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists. Run the workflow again."
            exit 1
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then exit "$status"; fi
          fi
          gh release create "$TAG" "$apk" release-assets/release-metadata.json \
            --target "$TARGET_SHA" \
            --title "Karsa Mobile $VERSION" \
            --notes "Memerlukan Android 7 atau lebih baru dengan ARM64. Pasang sebagai pembaruan aplikasi yang sudah ada." \
            --generate-notes
