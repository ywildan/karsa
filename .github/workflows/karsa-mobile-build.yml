name: Build Karsa Mobile APK

on:
  push:
    branches: [main]
    paths:
      - 'karsa-mobile/**'
      - '.github/workflows/karsa-mobile-build.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Flutter project
        run: |
          rm -rf karsa-mobile-build
          flutter create --org ac.id.untidar --project-name karsa_mobile karsa-mobile-build

      - name: Overlay custom source files
        run: |
          cp karsa-mobile/pubspec.yaml karsa-mobile-build/pubspec.yaml
          cp karsa-mobile/lib/main.dart karsa-mobile-build/lib/main.dart
          mkdir -p karsa-mobile-build/assets
          cp karsa-mobile/assets/*.png karsa-mobile-build/assets/

      - name: Patch app name (SiKarsa)
        run: |
          sed -i 's/android:label="karsa_mobile"/android:label="SiKarsa"/' karsa-mobile-build/android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' karsa-mobile-build/android/app/src/main/AndroidManifest.xml

      - name: Patch minSdkVersion for webview_flutter
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' karsa-mobile-build/android/app/build.gradle
          grep -n "minSdkVersion" karsa-mobile-build/android/app/build.gradle

      - name: Patch AndroidManifest for Internet permission
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' karsa-mobile-build/android/app/src/main/AndroidManifest.xml
          grep -n "permission" karsa-mobile-build/android/app/src/main/AndroidManifest.xml

      - name: Patch Kotlin Gradle plugin version
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.23"/' karsa-mobile-build/android/settings.gradle
          grep -n "org.jetbrains.kotlin.android" karsa-mobile-build/android/settings.gradle

      - name: Get dependencies
        run: |
          cd karsa-mobile-build
          flutter pub get

      - name: Generate launcher icons
        run: |
          cd karsa-mobile-build
          dart run flutter_launcher_icons

      - name: Build release APK
        run: |
          cd karsa-mobile-build
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: karsa-mobile-apk
          path: karsa-mobile-build/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK to release (optional)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: karsa-mobile-build/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
